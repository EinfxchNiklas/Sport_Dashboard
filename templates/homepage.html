<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sport Dashboard</title>
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/sports_dashboard.css') }}?v=20260414">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/sports_dashboard.mobile.css') }}?v=20260414">
    {% if umami_enabled %}
    <script defer src="{{ umami_script_url }}" data-website-id="{{ umami_website_id }}"></script>
    {% endif %}
</head>
<body class="page-home">
    <a href="/docs" class="docs-button" title="Dokumentation">Docs</a>
    <a href="/impressum" class="impressum-button" title="Impressum">Impressum</a>
    <div class="container">

        <!-- ── Fußball ── -->
        <div class="sport-section fussball fussball-split">
            <span class="trophy-layer trophy-fussball"></span>
            <div class="content">
                <div class="sport-name">FUßBALL</div>
                <div class="arrow">↓</div>
            </div>
            <div class="fussball-split-links" aria-label="Fußball Auswahl">
                <a href="/fussball/wm?source=home" class="fussball-split-link fussball-split-link-top">
                    <span class="split-link-title">WM</span>
                    <span class="split-link-subtitle">Spiele &amp; Gruppen</span>
                    <span class="split-link-arrow">↓</span>
                </a>
                <a href="/fussball" class="fussball-split-link fussball-split-link-bottom">
                    <span class="split-link-title">Wettbewerbe</span>
                    <span class="split-link-subtitle">CL, DFB-Pokal &amp; WM</span>
                    <span class="split-link-arrow">↓</span>
                </a>
            </div>
        </div>

        <!-- ── Formel 1 ── -->
        <a href="/formula1" class="sport-section formula1">
            <span class="trophy-layer trophy-formula1"></span>
            <div class="content">
                <div class="sport-name">Formel 1</div>
                <div class="sport-subtitle">Rennen &amp; Standings</div>
                <div class="arrow">↓</div>
            </div>
        </a>

        <!-- ── American Football ── -->
        <a href="/american_football" class="sport-section american-football">
            <span class="trophy-layer trophy-american-football"></span>
            <div class="content">
                <div class="sport-name">American Football</div>
                <div class="sport-subtitle">Spiele &amp; Standings</div>
                <div class="arrow">↓</div>
            </div>
        </a>

    </div>
</body>
</html>
