<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fussball - Nicht verfuegbar</title>
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
    {% if umami_enabled %}
    <script defer src="{{ umami_script_url }}" data-website-id="{{ umami_website_id }}"></script>
    {% endif %}
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #141414;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal {
            width: min(540px, 100%);
            background: #ffffff;
            border-radius: 14px;
            padding: 28px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .modal h1 {
            margin: 0 0 12px;
            color: #1b2a41;
            font-size: 1.5rem;
        }

        .modal p {
            margin: 0;
            color: #2f3e56;
            font-size: 1.05rem;
            line-height: 1.45;
        }

        .modal a {
            margin-top: 20px;
            display: inline-block;
            text-decoration: none;
            color: #ffffff;
            background: #1b2a41;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
        }

        .modal a:hover {
            background: #243b55;
        }
    </style>
</head>
<body>
    <div class="overlay" role="dialog" aria-modal="true" aria-labelledby="fussballStatusTitle">
        <div class="modal">
            <h1 id="fussballStatusTitle">Fußball Daten aktuell nicht verfügbar</h1>
            <p>Es wird an einer Lösung gearbeitet</p>
            <a href="/">Zur Homepage</a>
        </div>
    </div>
</body>
</html>
